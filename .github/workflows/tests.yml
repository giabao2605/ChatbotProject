# P0 #2 — CI chay test moi commit / pull request.
# Dat file nay tai: .github/workflows/tests.yml
#
# Chi chay nhom test NHANH (unit + security), KHONG chay integration/eval
# (vi can SQL Server / Qdrant / RAG server that).
name: tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Clean install, test, and build frontend
        run: |
          npm ci
          npm run test:coverage
          npm run build
          npm audit --audit-level=high

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit locked runtime dependencies
        run: |
          python -m pip install pip-audit
          pip-audit --disable-pip --no-deps -r requirements.lock.txt

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          # qdrant-client chi can phan `models` (khong can server) de test RBAC.
          # Cai rieng o day cho CI nhe, khong keo ca requirements.txt nang.
          pip install "qdrant-client>=1.7"

      - name: Run fast tests (unit + security)
        run: |
          pytest -m "not integration and not eval" -v \
            --cov=mech_chatbot \
            --cov-branch \
            --cov-report=json:reports/refactor/phase-0/coverage-backend-ci.json
          python scripts/quality/check_coverage.py \
            reports/refactor/phase-0/coverage-backend-ci.json \
            --min-line 80 \
            --min-branch 80
