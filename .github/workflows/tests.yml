# P0 #2 — CI chay test moi commit / pull request.
# Dat file nay tai: .github/workflows/tests.yml
#
# Chi chay nhom test NHANH (unit + security), KHONG chay integration/eval
# (vi can SQL Server / Qdrant / RAG server that).
name: tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install, test, and build frontend
        run: |
          npm ci
          npm run test:coverage
          npm run build

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements/requirements.txt
            backend/requirements/requirements-test.txt

      - name: Install runtime and test deps
        run: |
          python -m pip install --upgrade pip
          # Test against the versions production serves (chat_env snapshot), not the newest releases.
          sed -E 's/ --hash=.*//; /^(#|$)/d' backend/requirements/requirements-windows-runtime.lock.txt > "$RUNNER_TEMP/constraints.txt"
          python -m pip install -r backend/requirements/requirements.txt -r backend/requirements/requirements-test.txt \
            -c "$RUNNER_TEMP/constraints.txt"

      - name: Run fast tests (unit + security)
        run: |
          export PYTHONPATH=backend/src
          python -m pytest -m "not integration and not eval" -v --maxfail=1 \
            --cov=mech_chatbot \
            --cov-branch \
            --cov-report=json:reports/refactor/phase-0/coverage-backend-ci.json
          python scripts/quality/check_coverage.py \
            reports/refactor/phase-0/coverage-backend-ci.json \
            --min-line 80 \
            --min-branch 80
